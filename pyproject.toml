[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstats-lab"
version = "0.2.1"
description = "Reproducible probability, inference, stochastic simulation and risk analytics for quantitative research."
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yuvi"}]
keywords = ["quantitative-finance", "statistics", "simulation", "risk", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "plotly>=5.24,<8", "pandas>=2.2,<4"]
desktop = ["PySide6>=6.8,<7", "matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "build>=1.2,<2", "pandas>=2.2,<4"]

[project.scripts]
quantstats-lab-desktop = "quantstats_lab.desktop:main"

[project.urls]
Repository = "https://github.com/yuvsta1/quantstats-lab"
Issues = "https://github.com/yuvsta1/quantstats-lab/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantstats_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.coverage.run]
source = ["quantstats_lab"]
omit = ["*/quantstats_lab/app.py", "*/quantstats_lab/desktop.py"]  # Both UIs smoke-tested independently
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85