name: macOS Desktop App

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install desktop and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]" "pyinstaller>=6.13,<7"
      - name: Verify arm64 runner
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Run native desktop tests without a screen
        run: python -m pytest tests/test_desktop_core.py tests/test_desktop_ui.py -q
      - name: Render app icon
        run: python scripts/make_macos_icon.py
      - name: Build standalone .app
        run: |
          python -m PyInstaller \
            --clean --noconfirm --onedir --windowed \
            --name "QuantStats Lab" \
            --icon "assets/logo.icns" \
            --add-data "assets/logo-original.png:assets" \
            --osx-bundle-identifier "io.github.yuvsta1.quantstatslab" \
            "scripts/desktop_entry.py"
      - name: Verify app structure
        run: |
          test -d "dist/QuantStats Lab.app"
          test -x "dist/QuantStats Lab.app/Contents/MacOS/QuantStats Lab"
          plutil -lint "dist/QuantStats Lab.app/Contents/Info.plist"
      - name: Create downloadable zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/QuantStats Lab.app" \
            "QuantStats-Lab-macOS-Apple-Silicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: QuantStats-Lab-macOS-Apple-Silicon
          path: QuantStats-Lab-macOS-Apple-Silicon.zip
          if-no-files-found: error
          retention-days: 30
