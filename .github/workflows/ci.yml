name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tools
        run: python -m pip install -e ".[app,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests and coverage
        run: python -m pytest --cov=quantstats_lab --cov-report=term-missing
      - name: Example smoke test
        run: python examples/research_walkthrough.py
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
  desktop-smoke:
    name: Native desktop (Python 3.13)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install optional GUI dependencies
        run: python -m pip install -e ".[desktop,dev]"
      - name: Native Qt smoke tests
        run: python -m pytest tests/test_desktop_core.py tests/test_desktop_ui.py -q
